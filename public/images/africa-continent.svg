<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none">
  <defs>
    <linearGradient id="africaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0B428" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F07828" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0064B4" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Detailed Stylized African Continent Contour -->
  <path id="continent-path" d="M 280,45 
           C 310,40 370,50 410,75 
           C 435,90 450,115 440,140 
           C 430,165 410,180 435,210 
           C 460,240 500,260 520,300 
           C 535,330 520,360 485,380 
           C 455,400 440,430 430,470 
           C 420,510 405,560 380,600 
           C 350,650 320,680 290,680 
           C 275,680 260,650 250,610 
           C 240,560 215,500 200,440 
           C 185,380 150,350 110,335 
           C 70,320 40,300 45,260 
           C 50,220 90,195 130,180 
           C 170,165 190,150 210,110 
           C 230,70 250,50 280,45 Z" 
        stroke="url(#africaGold)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="url(#africaGold)" 
        fill-opacity="0.04" />
  <!-- Abuja, Nigeria Epicenter Hub Indicator -->
  <g transform="translate(180, 270)">
    <circle cx="0" cy="0" r="14" fill="#F0B428" fill-opacity="0.2" class="animate-ping" />
    <circle cx="0" cy="0" r="7" fill="#DC0000" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    <text x="12" y="4" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F0B428" letter-spacing="1">ABUJA HQ</text>
  </g>
  <!-- Bilateral Radiating Arc Lines from Abuja -->
  <path d="M 180,270 Q 320,160 460,110" stroke="#F0B428" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6"/>
  <path d="M 180,270 Q 280,390 350,550" stroke="#F0B428" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6"/>
  <path d="M 180,270 Q 110,310 70,260" stroke="#F0B428" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6"/>
  <path d="M 180,270 Q 260,260 480,340" stroke="#F0B428" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6"/>
</svg>
